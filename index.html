<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GTA:SA Embedding Projector</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#ffffff; overflow:hidden; font-family:'Courier New',monospace; }
#canvas { display:block; }
#searchbox {
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  z-index:10; display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.95); border:1px solid #ddd;
  border-radius:8px; padding:7px 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
#search {
  border:none; outline:none; font-family:'Courier New',monospace;
  font-size:13px; color:#333; background:transparent; width:220px;
}
#search::placeholder { color:#bbb; }
#match-count { font-size:11px; color:#bbb; white-space:nowrap; }
#clear-btn {
  font-size:14px; color:#bbb; cursor:pointer; line-height:1;
  background:none; border:none; padding:0;
}
#clear-btn:hover { color:#666; }
#stats { position:fixed; bottom:12px; left:12px; font-size:11px; color:#bbb; }
#controls { position:fixed; bottom:12px; right:12px; font-size:11px; color:#ccc; }
#tooltip {
  position:fixed; pointer-events:none; display:none;
  background:rgba(255,255,255,0.95); border:1px solid #ddd;
  border-radius:6px; padding:6px 10px; font-size:12px;
  color:#333; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
#loading {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:14px; color:#999;
}
</style>
</head>
<body>
<div id="loading">Loading embeddings...</div>
<div id="searchbox">
  <input id="search" type="text" placeholder="Search objects..." autocomplete="off" />
  <span id="match-count"></span>
  <button id="clear-btn" title="Clear">✕</button>
</div>
<canvas id="canvas"></canvas>
<div id="tooltip"></div>
<div id="stats"></div>
<div id="controls">Drag to rotate · Scroll to zoom · Click a point</div>

<script>
const PALETTE = [
  '#E63946','#457B9D','#2A9D8F','#c9a227','#F4A261',
  '#6a9fb5','#6A4C93','#F77F00','#4CC9F0','#7B2D8B',
  '#06D6A0','#EF476F','#118AB2','#e0a800','#83C5BE'
];

fetch('embeddings_data.json')
  .then(r => r.json())
  .then(DATA => {
    document.getElementById('loading').style.display = 'none';

    const cats = [...new Set(DATA.categories)].sort();
    const catColor = {};
    cats.forEach((c,i) => catColor[c] = PALETTE[i % PALETTE.length]);

    const canvas = document.getElementById('canvas');
    let W, H;
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      render();
    }
    window.addEventListener('resize', resize);
    const ctx = canvas.getContext('2d');

    let rotX = 0.3, rotY = 0.5, zoom = 1.0;
    let dragging = false, lastX, lastY;
    let selectedIdx = null, highlightSet = new Set();
    let searchHighlight = new Set();

    function project(x, y, z) {
      let x1 = x * Math.cos(rotY) + z * Math.sin(rotY);
      let z1 = -x * Math.sin(rotY) + z * Math.cos(rotY);
      let y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
      let z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);
      const scale = W * 2.5 * zoom / (4 + z2);
      return { sx: W/2 + x1 * scale, sy: H/2 - y2 * scale, depth: z2 };
    }

    function hexToRgb(hex) {
      return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      [[ 1,0,0,'#ffb3b3'],[0,1,0,'#b3e0d8'],[0,0,1,'#b3ccdd']].forEach(([ax,ay,az,col]) => {
        const o = project(0,0,0), e = project(ax*0.8,ay*0.8,az*0.8);
        ctx.beginPath(); ctx.moveTo(o.sx,o.sy); ctx.lineTo(e.sx,e.sy);
        ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.6; ctx.stroke();
        ctx.globalAlpha = 1;
      });

      const pts = DATA.points.map((p,i) => ({i, proj: project(p[0],p[1],p[2])}));
      pts.sort((a,b) => b.proj.depth - a.proj.depth);
      let labelsToDraw = [];
      const hasFilter = highlightSet.size > 0 || searchHighlight.size > 0;

      pts.forEach(({i, proj}) => {
        const isSelected = i === selectedIdx;
        const isNeighbour = highlightSet.has(i);
        const isSearch = searchHighlight.has(i);
        const [r,g,b] = hexToRgb(catColor[DATA.categories[i]]);
        let alpha = 0.45, size = 2.5;
        if (isSelected) { alpha = 1; size = 7; }
        else if (isNeighbour) { alpha = 0.95; size = 4.5; }
        else if (isSearch) { alpha = 1; size = 5; }
        else if (hasFilter) { alpha = 0.06; size = 2; }
        ctx.beginPath();
        ctx.arc(proj.sx, proj.sy, size, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.fill();
        if (isSelected || isNeighbour || isSearch) {
          labelsToDraw.push({sx:proj.sx, sy:proj.sy, name:DATA.names[i], isSelected, isSearch});
        }
      });

      labelsToDraw.forEach(({sx,sy,name,isSelected,isSearch}) => {
        ctx.font = isSelected ? 'bold 13px Courier New' : '11px Courier New';
        ctx.fillStyle = isSelected ? '#111' : isSearch ? '#c9a227' : '#666';
        ctx.fillText(name, sx+6, sy-4);
      });

      document.getElementById('stats').textContent =
        `${DATA.points.length} objects · PCA (${(DATA.explained[0]*100).toFixed(1)}% + ${(DATA.explained[1]*100).toFixed(1)}% + ${(DATA.explained[2]*100).toFixed(1)}% variance)`;
    }

    // Search
    const searchInput = document.getElementById('search');
    const matchCount = document.getElementById('match-count');
    const clearBtn = document.getElementById('clear-btn');

    searchInput.addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      searchHighlight = new Set();
      if (q.length > 1) {
        DATA.names.forEach((n, i) => {
          if (n.toLowerCase().includes(q)) searchHighlight.add(i);
        });
        matchCount.textContent = searchHighlight.size > 0 ? `${searchHighlight.size} found` : 'no results';
      } else {
        matchCount.textContent = '';
      }
      selectedIdx = null; highlightSet = new Set();
      render();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchHighlight = new Set();
      matchCount.textContent = '';
      selectedIdx = null; highlightSet = new Set();
      render();
    });

    // Mouse
    canvas.addEventListener('mousedown', e => { dragging=true; lastX=e.clientX; lastY=e.clientY; });
    canvas.addEventListener('mousemove', e => {
      if (!dragging) return;
      rotY += (e.clientX-lastX)*0.008;
      rotX += (e.clientY-lastY)*0.008;
      lastX=e.clientX; lastY=e.clientY;
      render();
    });
    canvas.addEventListener('mouseup', () => dragging=false);
    canvas.addEventListener('mouseleave', () => dragging=false);
    canvas.addEventListener('wheel', e => {
      zoom *= e.deltaY>0 ? 0.92 : 1.08;
      zoom = Math.max(0.2, Math.min(5, zoom));
      render();
    }, {passive:true});

    canvas.addEventListener('mousemove', e => {
      if (dragging) return;
      const mx=e.clientX, my=e.clientY;
      let best=null, bestDist=12;
      DATA.points.forEach((p,i) => {
        const proj=project(p[0],p[1],p[2]);
        const d=Math.hypot(proj.sx-mx, proj.sy-my);
        if (d<bestDist) { bestDist=d; best=i; }
      });
      const tip=document.getElementById('tooltip');
      if (best!==null) {
        tip.style.display='block';
        tip.style.left=(mx+14)+'px';
        tip.style.top=(my-10)+'px';
        tip.textContent=DATA.names[best];
        canvas.style.cursor='pointer';
      } else {
        tip.style.display='none';
        canvas.style.cursor='default';
      }
    });

    canvas.addEventListener('click', e => {
      const mx=e.clientX, my=e.clientY;
      let best=null, bestDist=14;
      DATA.points.forEach((p,i) => {
        const proj=project(p[0],p[1],p[2]);
        const d=Math.hypot(proj.sx-mx, proj.sy-my);
        if (d<bestDist) { bestDist=d; best=i; }
      });
      if (best!==null) {
        selectedIdx=best;
        highlightSet=new Set(DATA.neighbours[best]);
        highlightSet.add(best);
        searchHighlight=new Set();
        searchInput.value='';
        matchCount.textContent='';
      } else {
        selectedIdx=null; highlightSet=new Set();
      }
      render();
    });

    resize();
  });
</script>
</body>
</html>
